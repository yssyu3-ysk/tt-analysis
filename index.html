<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>卓球 試合分析ツール</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--danger:#dc2626;--ok:#059669}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:#111827;color:white;padding:10px 12px calc(10px + env(safe-area-inset-top));box-shadow:0 2px 8px #0002}
h1{font-size:18px;margin:0 0 5px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:#cbd5e1}
main{max-width:1100px;margin:auto;padding:10px 10px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 2px #0000000b}
.video-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden}
video{display:block;width:100%;max-height:55vh;background:#000}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
button,select,input,textarea{font:inherit}
button{border:0;border-radius:10px;padding:11px 10px;background:#e5e7eb;color:#111827;font-weight:700;min-height:44px}
button.primary{background:var(--accent);color:white}.danger{background:#fee2e2;color:#991b1b}.ok{background:#d1fae5;color:#065f46}
button:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:700}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:white}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.score .num{font-size:42px;font-weight:800;line-height:1}.score .name{font-size:13px;font-weight:700}.dash{font-size:24px;color:var(--muted)}
.game-tabs{display:flex;gap:6px;overflow:auto}.game-tab{min-width:64px}.game-tab.active{background:#dbeafe;color:#1d4ed8}
.point-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.winner{font-size:16px;padding:15px}.me{background:#dbeafe;color:#1d4ed8}.opp{background:#fee2e2;color:#b91c1c}
.cause-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.cause{background:#f9fafb;border:1px solid var(--line);text-align:left;font-size:13px}.cause.selected{background:#dbeafe;border-color:#2563eb;color:#1d4ed8}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.pill{background:#eef2ff;padding:5px 8px;border-radius:999px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #e5e7eb;padding:7px;text-align:left}th{position:sticky;top:0;background:#f9fafb}
.scroll{overflow:auto;max-height:340px}.right{text-align:right}.hidden{display:none!important}
details summary{font-weight:800;cursor:pointer;padding:4px 0}
footer{color:var(--muted);font-size:11px;text-align:center;margin-top:20px}
@media(min-width:800px){.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:10px}.span2{grid-column:1/-1}.cause-grid{grid-template-columns:repeat(3,1fr)}}

.modal{position:fixed;inset:0;z-index:100;background:#111827ee;overflow:auto;padding:10px}
.dashboard{max-width:1100px;margin:auto;background:#f8fafc;border-radius:16px;padding:14px;min-height:100%}
.dashboard-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.dash-title{font-size:22px;font-weight:900}.dash-sub{font-size:12px;color:#64748b;margin-top:3px}
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.dash-card{background:white;border:1px solid #dbe1e8;border-radius:12px;padding:12px}
.dash-card h3{font-size:13px;margin:0 0 8px}.big{font-size:32px;font-weight:900}.dash-table{width:100%;border-collapse:collapse;font-size:12px}.dash-table th,.dash-table td{padding:7px;border-bottom:1px solid #e5e7eb}.barrow{display:grid;grid-template-columns:78px 1fr 28px;gap:6px;align-items:center;margin:5px 0;font-size:11px}.bar{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:#2563eb}.muted{color:#64748b}
.match-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;background:#fafafa}
.match-row .info{min-width:0}.match-row .title{font-weight:800}.match-row .sub{font-size:11px;color:var(--muted);margin-top:2px}.match-row .actions{display:flex;gap:5px}.match-row button{min-height:36px;padding:7px 9px;font-size:12px}
.dash-nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.dash-nav button.active{background:#dbeafe;color:#1d4ed8}.dash-page{display:none}.dash-page.active{display:block}.cross-table{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed}.cross-table th,.cross-table td{padding:5px 3px;border:1px solid #e5e7eb;text-align:center;white-space:nowrap}.cross-table th{position:static;background:#f1f5f9;font-weight:800}.cross-table .rowhead{text-align:left;font-weight:800;background:#f8fafc}.cross-table .total{font-weight:900;background:#f8fafc}.dash-section-title{font-size:13px;font-weight:900;margin:8px 0 5px}.dash-note{font-size:10px;color:#64748b;margin:3px 0 6px}.combo-table{width:100%;border-collapse:collapse;font-size:10px}.combo-table th,.combo-table td{padding:5px 4px;border-bottom:1px solid #e5e7eb;text-align:left}.combo-table th{position:static;background:#f8fafc}.scene-tag{display:inline-block;padding:2px 5px;border-radius:5px;background:#eef2ff;font-weight:800}.cause-matrix td:first-child{text-align:left;white-space:normal}.dash-footer{font-size:9px;color:#94a3b8;margin-top:7px}
.cause-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:6px 0 8px}.cause-tabs button.active{background:#dbeafe;color:#1d4ed8;font-weight:900}.cause-window.hidden{display:none}
@media(min-width:700px){.dash-grid{grid-template-columns:repeat(4,1fr)}}
@media print{body>*:not(#dashboardModal){display:none!important}.modal{position:static;background:white;padding:0}.dashboard{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="topline"><h1>🏓 卓球 試合分析ツール</h1><span id="status" class="small">ローカル処理</span></div>
  <div class="small">動画は端末内だけで再生・解析します。サーバーへアップロードしません。</div>
</header>

<main>
<div class="layout">
<section>
  <div class="card">
    <label>試合情報</label>
    <div class="grid2">
      <div><label>試合日</label><input id="matchDate" type="date"></div>
      <div><label>対戦相手</label><input id="matchOpponent" placeholder="相手選手名"></div>
    </div>
    <div style="margin-top:8px"><label>試合メモ</label><textarea id="matchMemo" rows="2" placeholder="大会名、会場、練習試合など"></textarea></div>
    <button id="saveMatch" class="primary" style="width:100%;margin-top:8px">💾 この試合を保存</button>
  </div>

  <div class="card">
    <label>試合動画</label>
    <input id="videoFile" type="file" accept="video/*,.mp4,.mov,.m4v,.webm">
    <div class="video-wrap" style="margin-top:8px"><video id="video" playsinline webkit-playsinline controls preload="metadata"></video></div>
    <div class="controls">
      <button id="playBtn" class="primary">▶ 再生</button>
      <button id="backBtn">↶ 5秒戻る</button>
      <button id="fwdBtn">5秒進む ↷</button>
    </div>
    <div class="meta" style="margin-top:8px">
      <span class="pill">現在 <b id="time">0:00.0</b></span>
      <span class="pill">点 <b id="pointNo">1</b></span>
      <span class="pill">ゲーム <b id="gameNo">1</b></span>
    </div>
  </div>

  <div class="card">
    <div class="score">
      <div><div class="name" id="meName">自分</div><div class="num" id="meScore">0</div></div>
      <div class="dash">-</div>
      <div><div class="name" id="oppName">相手</div><div class="num" id="oppScore">0</div></div>
    </div>
    <div class="meta" style="justify-content:center;margin-top:7px">
      <span class="pill">ゲーム <b id="gameScore">0 - 0</b></span>
      <span class="pill">次のサーバー: <b id="serverNow">—</b></span>
    </div>
  </div>

  <div class="card">
    <label>この点の勝者を選択</label>
    <div class="point-actions">
      <button class="winner me" id="winMe">自分の得点</button>
      <button class="winner opp" id="winOpp">相手の得点</button>
    </div>
    <div id="causeArea" class="hidden" style="margin-top:12px">
      <label>何球目で得点・失点したか</label>
      <div id="ballNumbers" class="cause-grid"></div>
      <label style="margin-top:12px">得点・失点の主な原因</label>
      <div id="causes" class="cause-grid"></div>
      <div style="margin-top:8px"><label>メモ（任意）</label><textarea id="note" rows="2" placeholder="例：バック対バックで先にミドルへ打ち切れなかった"></textarea></div>
      <button id="savePoint" class="primary" style="width:100%;margin-top:8px">この点を記録</button>
    </div>
  </div>

  <div class="card">
    <label>ゲーム</label>
    <div id="gameTabs" class="game-tabs"></div>
    <div style="margin-top:8px" class="grid2">
      <button id="newGame" class="ok">次のゲームへ</button>
      <button id="undo" class="danger">直前の記録を取り消す</button>
    </div>
  </div>
</section>

<section>
  <div class="card">
    <label>ゲーム1の最初のサーバー</label>
    <div class="grid2">
      <button id="serveMe">自分</button><button id="serveOpp">相手</button>
    </div>
    <div class="small" style="margin-top:7px;color:#6b7280">ゲーム2以降は前ゲームの最初のサーバーを自動的に交替。各ゲーム内は2本交替、10-10以降は1本交替です。</div>
  </div>

  <div class="card">
    <details open>
      <summary>選択肢をカスタマイズ</summary>
      <div style="margin-top:10px">
        <label>得点の原因（1行1項目）</label>
        <textarea id="causeConfigMe" rows="7"></textarea>
        <label style="margin-top:8px">失点の原因（1行1項目）</label>
        <textarea id="causeConfigOpp" rows="8"></textarea>
        <div class="grid2" style="margin-top:8px"><button id="applyConfig" class="primary">反映</button><button id="resetConfig">初期値に戻す</button></div>
      </div>
      <div style="margin-top:12px">
        <label>選手名</label>
        <div class="grid2"><input id="meInput" placeholder="自分"><input id="oppInput" placeholder="相手"></div>
        <button id="applyNames" style="width:100%;margin-top:8px">名前を反映</button>
      </div>
    </details>
  </div>

  <div class="card">
    <details open>
      <summary>記録</summary>
      <div class="scroll" style="margin-top:8px"><table><thead><tr><th>G</th><th>点</th><th>時刻</th><th>勝者</th><th>サーブ</th><th>何球目</th><th>原因</th></tr></thead><tbody id="log"></tbody></table></div>
      <div class="grid2" style="margin-top:8px"><button id="exportJson">JSON保存</button><button id="exportCsv">CSV保存</button></div>
      <button id="dashboardBtn" class="primary" style="width:100%;margin-top:7px">📊 スクショ用ダッシュボード</button>
      <input id="importJson" type="file" accept=".json,application/json" class="hidden">
      <button id="importBtn" style="width:100%;margin-top:7px">JSON読込</button>
    </details>
  </div>

  <div class="card">
    <details open>
      <summary>保存した試合を管理</summary>
      <div style="margin-top:8px">
        <div class="grid2">
          <button id="newMatch">＋ 新しい試合</button>
          <button id="clearAllMatches" class="danger">保存データを全削除</button>
        </div>
        <div id="matchList" style="margin-top:8px"></div>
      </div>
    </details>
  </div>

  <div class="card">
    <label>試合結果 / 原因分析</label>
    <div id="result"></div>
  </div>
</section>
</div>
<footer>データはブラウザのlocalStorageにも保存されます。動画ファイル自体は保存・送信しません。</footer>
</main>

<script>

const DEFAULT_CAUSES={
 me:["サービスエース","台上技術","ドライブ","スマッシュ","ショート、プッシュ","ブロック、カウンター","相手のブロックミス","相手のレシーブミス","相手の台上ミス","相手の強打ミス","相手の凡ミス"],
 opp:["台上技術","強打","レシーブミス","台上ミス","ブロックミス","つなぎドライブミス","ドライブ強打ミス","スマッシュミス"]
};
const BALL_LABELS=["","1球目","2球目","3球目","4球目","5球目以降"];
const state={
 id:null, date:"", me:"自分", opp:"相手", matchMemo:"",
 firstServer:null, currentGame:1, gameWinsMe:0, gameWinsOpp:0,
 games:[{me:0,opp:0,points:[]}], selectedWinner:null, selectedCause:null, selectedBall:null,
 causes:JSON.parse(localStorage.getItem("tt_causes")||"null")||JSON.parse(JSON.stringify(DEFAULT_CAUSES))
};
const $=id=>document.getElementById(id);
const video=$("video");

function uid(){return "m_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(t){if(!isFinite(t))return "0:00.0";let m=Math.floor(t/60),sec=(t%60).toFixed(1).padStart(4,"0");return `${m}:${sec}`}
function current(){return state.games[state.currentGame-1]}
function totalPoints(g){return g.me+g.opp}
function gameWinner(g){return ((g.me>=11||g.opp>=11)&&Math.abs(g.me-g.opp)>=2)?(g.me>g.opp?"me":"opp"):null}
function updateGameWins(){state.gameWinsMe=state.games.filter(g=>gameWinner(g)==="me").length;state.gameWinsOpp=state.games.filter(g=>gameWinner(g)==="opp").length}
function firstServerForGame(gameIndex){
 if(state.firstServer===null)return null;
 return gameIndex%2===1 ? state.firstServer : (state.firstServer==="me"?"opp":"me");
}
function serverForPoint(g){
 const first=firstServerForGame(state.currentGame);
 if(!first)return null;
 const n=totalPoints(g);
 const interval=(g.me>=10&&g.opp>=10)?1:2;
 return (Math.floor(n/interval)%2===0)?first:(first==="me"?"opp":"me");
}
function renderBallNumbers(){
 $("ballNumbers").innerHTML="";
 BALL_LABELS.slice(1).forEach((label,i)=>{
   const b=document.createElement("button");
   b.className="cause"+(state.selectedBall===i+1?" selected":"");
   b.textContent=label;
   b.onclick=()=>{state.selectedBall=i+1;renderBallNumbers()};
   $("ballNumbers").appendChild(b);
 });
}
function renderCauses(){
 $("causes").innerHTML="";
 const list=state.causes[state.selectedWinner]||[];
 list.forEach(c=>{
   const b=document.createElement("button");
   b.className="cause"+(state.selectedCause===c?" selected":"");
   b.textContent=c;
   b.onclick=()=>{state.selectedCause=c;renderCauses()};
   $("causes").appendChild(b);
 });
}
function getLibrary(){return JSON.parse(localStorage.getItem("tt_match_library")||"[]")}
function saveLibrary(list){localStorage.setItem("tt_match_library",JSON.stringify(list))}
function snapshot(){
 return JSON.parse(JSON.stringify({
   id:state.id,date:state.date,me:state.me,opp:state.opp,matchMemo:state.matchMemo,
   firstServer:state.firstServer,currentGame:state.currentGame,gameWinsMe:state.gameWinsMe,
   gameWinsOpp:state.gameWinsOpp,games:state.games,causes:state.causes
 }))
}
function saveCurrent(){
 if(!state.id)state.id=uid();
 const data=snapshot();
 localStorage.setItem("tt_state",JSON.stringify(data));
 const list=getLibrary();
 const i=list.findIndex(x=>x.id===state.id);
 if(i>=0)list[i]=data;else list.unshift(data);
 saveLibrary(list);
}
function loadCurrent(){
 const s=JSON.parse(localStorage.getItem("tt_state")||"null");
 if(!s)return;
 Object.assign(state,s);
 state.games=state.games?.length?state.games:[{me:0,opp:0,points:[]}];
 if(Array.isArray(state.causes)){ state.causes={me:[...state.causes],opp:[...DEFAULT_CAUSES.opp]}; }
 state.causes=state.causes?.me?.length?state.causes:{me:[...DEFAULT_CAUSES.me],opp:[...DEFAULT_CAUSES.opp]};
 state.games.forEach(g=>g.points.forEach(p=>{if(!p.ball)p.ball=5}));
 updateGameWins();
}
function clearSelection(){state.selectedWinner=null;state.selectedCause=null;state.selectedBall=null}
function render(){
 const g=current();
 updateGameWins();
 $("meName").textContent=state.me;$("oppName").textContent=state.opp;
 $("meScore").textContent=g.me;$("oppScore").textContent=g.opp;
 $("gameNo").textContent=state.currentGame;$("pointNo").textContent=totalPoints(g)+1;
 $("gameScore").textContent=`${state.gameWinsMe} - ${state.gameWinsOpp}`;
 const s=serverForPoint(g);$("serverNow").textContent=s?(s==="me"?state.me:state.opp):"未設定";
 $("meInput").value=state.me;$("oppInput").value=state.opp;
 $("matchDate").value=state.date||"";
 $("matchOpponent").value=state.opp||"";
 $("matchMemo").value=state.matchMemo||"";
 $("causeConfigMe").value=state.causes.me.join("\n");
 $("causeConfigOpp").value=state.causes.opp.join("\n");
 $("causeArea").classList.toggle("hidden",!state.selectedWinner);
 renderBallNumbers();renderCauses();renderTabs();renderLog();renderResult();renderMatchList();
}
function renderTabs(){
 $("gameTabs").innerHTML="";
 for(let i=1;i<=5;i++){
   let b=document.createElement("button");
   b.className="game-tab"+(i===state.currentGame?" active":"");
   b.textContent=`G${i}`;
   b.onclick=()=>{if(state.games[i-1]){state.currentGame=i;clearSelection();render()}};
   $("gameTabs").appendChild(b);
 }
}
function renderLog(){
 let rows=[];
 state.games.forEach((g,gi)=>g.points.forEach((p,pi)=>{
   rows.push(`<tr><td>G${gi+1}</td><td>${pi+1}</td><td>${fmt(p.time)}</td><td>${p.winner==="me"?escapeHtml(state.me):escapeHtml(state.opp)}</td><td>${p.server==="me"?escapeHtml(state.me):escapeHtml(state.opp)}</td><td>${BALL_LABELS[p.ball]||"—"}</td><td>${escapeHtml(p.cause||"—")}</td></tr>`)
 }));
 $("log").innerHTML=rows.join("")||'<tr><td colspan="7">まだ記録がありません</td></tr>';
}
function renderResult(){
 updateGameWins();
 let all=state.games.flatMap(g=>g.points);
 const myPts=all.filter(p=>p.winner==="me").length,oppPts=all.filter(p=>p.winner==="opp").length;
 let html=`<div class="score" style="margin-bottom:12px"><div><b>${escapeHtml(state.me)}</b><div class="num" style="font-size:32px">${state.gameWinsMe}</div></div><div>ゲーム</div><div><b>${escapeHtml(state.opp)}</b><div class="num" style="font-size:32px">${state.gameWinsOpp}</div></div></div>`;
 html+=`<div class="meta"><span class="pill">${escapeHtml(state.date||"日付未設定")}</span><span class="pill">対戦：${escapeHtml(state.opp)}</span><span class="pill">ポイント ${myPts}-${oppPts}</span></div>`;
 const count={得点:{},失点:{}};
 all.forEach(p=>{const side=p.winner==="me"?"得点":"失点";count[side][p.cause]=(count[side][p.cause]||0)+1});
 html+=`<h3 style="margin:12px 0 6px">原因別</h3>`;
 for(const side of ["得点","失点"]){
   html+=`<b>${side}</b><ul>`;
   const entries=Object.entries(count[side]).sort((a,b)=>b[1]-a[1]);
   html+=entries.map(([k,v])=>`<li>${escapeHtml(k)}：${v}点</li>`).join("")||"<li>—</li>";
   html+="</ul>";
 }
 html+=`<h3 style="margin:8px 0">ゲーム別</h3><ul>`+state.games.map((g,i)=>`<li>G${i+1}: ${g.me}-${g.opp}</li>`).join("")+"</ul>";
 $("result").innerHTML=html;
}
function pointStatsForGame(g){
 const x={msw:0,msl:0,mrw:0,mrl:0,osw:0,osl:0,orw:0,orl:0};
 g.points.forEach(p=>{
   if(p.server==="me"){
     if(p.winner==="me"){x.msw++;x.orl++} else {x.msl++;x.orw++}
   }else if(p.server==="opp"){
     if(p.winner==="opp"){x.osw++;x.mrl++} else {x.osl++;x.mrw++}
   }
 });
 return x;
}
function allPoints(){return state.games.flatMap((g,gi)=>g.points.map((p,pi)=>({...p,game:gi+1,point:pi+1})))}
function sceneForPoint(p){return p.server==="me"?"サーブ":"レシーブ"}
function ballLabel(b){return BALL_LABELS[b]||"—"}
function buildSceneBallMatrix(points,winner){
 const rows={"サーブ":[0,0,0,0,0],"レシーブ":[0,0,0,0,0]};
 points.filter(p=>p.winner===winner).forEach(p=>{if(p.ball>=1&&p.ball<=5)rows[sceneForPoint(p)][p.ball-1]++});
 return rows;
}
function buildSceneCauseMatrix(points){
 const rows={};
 points.forEach(p=>{
   const key=p.cause||"未分類";
   if(!rows[key])rows[key]={sW:0,sL:0,rW:0,rL:0};
   const scene=sceneForPoint(p);
   if(scene==="サーブ")p.winner==="me"?rows[key].sW++:rows[key].sL++;
   else p.winner==="me"?rows[key].rW++:rows[key].rL++;
 });
 return rows;
}
function topCombos(points){
 const map={};
 points.forEach(p=>{
   const key=[sceneForPoint(p),ballLabel(p.ball),p.winner==="me"?"得点":"失点",p.cause||"未分類"];
   const id=key.join("||");
   if(!map[id])map[id]={scene:key[0],ball:key[1],result:key[2],cause:key[3],n:0};
   map[id].n++;
 });
 return Object.values(map).sort((a,b)=>b.n-a.n).slice(0,10);
}
function causeList(filterWinner){
 const o={};
 allPoints().filter(p=>p.winner===filterWinner).forEach(p=>o[p.cause||"未分類"]=(o[p.cause||"未分類"]||0)+1);
 return Object.entries(o).sort((a,b)=>b[1]-a[1]);
}
function ballList(filterWinner){
 const a=[0,0,0,0,0];
 allPoints().filter(p=>p.winner===filterWinner).forEach(p=>{if(p.ball)a[p.ball-1]++});
 return a;
}
function renderSceneBallTable(points,winner){
 const rows=buildSceneBallMatrix(points,winner);
 const sums=[0,0,0,0,0];Object.values(rows).forEach(r=>r.forEach((v,i)=>sums[i]+=v));
 return `<table class="cross-table"><tr><th>場面</th>${BALL_LABELS.slice(1).map(x=>`<th>${x}</th>`).join("")}<th>計</th></tr>`+
   Object.entries(rows).map(([scene,r])=>`<tr><td class="rowhead">${scene}</td>${r.map(v=>`<td>${v}</td>`).join("")}<td class="total">${r.reduce((a,b)=>a+b,0)}</td></tr>`).join("")+`<tr><td class="rowhead total">計</td>${sums.map(v=>`<td class="total">${v}</td>`).join("")}<td class="total">${sums.reduce((a,b)=>a+b,0)}</td></tr></table>`;
}
function renderDashboard(){
 updateGameWins();
 const points=allPoints();
 const my=points.filter(p=>p.winner==="me").length,opp=points.length-my;
 let msw=0,msl=0,mrw=0,mrl=0;
 points.forEach(p=>{
   if(p.server==="me"){if(p.winner==="me")msw++;else msl++}
   else if(p.server==="opp"){if(p.winner==="me")mrw++;else mrl++}
 });
 const gamesHtml=state.games.map((g,i)=>`<tr><td>G${i+1}</td><td>${g.me}</td><td>${g.opp}</td></tr>`).join("");
 const combos=topCombos(points);
 $("dashSub").textContent=`${state.date||"日付未設定"}　｜　${state.me} vs ${state.opp}${state.matchMemo?"　｜　"+state.matchMemo:""}`;
 const page1=`<div class="dash-page active" id="dashPage1">
   <div class="dash-grid">
    <div class="dash-card"><h3>試合結果</h3><div class="big">${state.gameWinsMe} - ${state.gameWinsOpp}</div><div class="muted">${escapeHtml(state.me)} - ${escapeHtml(state.opp)}</div></div>
    <div class="dash-card"><h3>総ポイント</h3><div class="big">${my}-${opp}</div><div class="muted">全${points.length}ポイント</div></div>
    <div class="dash-card"><h3>${escapeHtml(state.me)} サーブ</h3><div class="big">${msw}-${msl}</div><div class="muted">得点 - 失点</div></div>
    <div class="dash-card"><h3>${escapeHtml(state.me)} レシーブ</h3><div class="big">${mrw}-${mrl}</div><div class="muted">得点 - 失点</div></div>
   </div>
   <div class="dash-section-title">① サーブ／レシーブ × 何球目（得点）</div>
   ${renderSceneBallTable(points,"me")}
   <div class="dash-section-title">② サーブ／レシーブ × 何球目（失点）</div>
   ${renderSceneBallTable(points,"opp")}
   <div class="dash-card" style="margin-top:8px"><h3>ゲーム別スコア</h3><table class="dash-table"><tr><th>G</th><th>${escapeHtml(state.me)}</th><th>${escapeHtml(state.opp)}</th></tr>${gamesHtml}</table></div>
   <div class="dash-footer">スクリーンショット用：このページを1枚目として保存してください。</div>
 </div>`;

 const scoreCombos=combos.filter(x=>x.result==="得点");
 const lossCombos=combos.filter(x=>x.result==="失点");
 const scoreCauseRows=Object.entries(buildSceneCauseMatrix(points)).map(([cause,v])=>({cause,v,total:v.sW+v.rW})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
 const lossCauseRows=Object.entries(buildSceneCauseMatrix(points)).map(([cause,v])=>({cause,v,total:v.sL+v.rL})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
 const scoreHtml=scoreCauseRows.map(x=>`<tr><td>${escapeHtml(x.cause)}</td><td>${x.v.sW}</td><td>${x.v.rW}</td><td class="total">${x.total}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">まだ得点記録がありません</td></tr>`;
 const lossHtml=lossCauseRows.map(x=>`<tr><td>${escapeHtml(x.cause)}</td><td>${x.v.sL}</td><td>${x.v.rL}</td><td class="total">${x.total}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">まだ失点記録がありません</td></tr>`;
 const scoreComboHtml=scoreCombos.map((x,i)=>`<tr><td>${i+1}</td><td>${x.scene}</td><td>${x.ball}</td><td>${escapeHtml(x.cause)}</td><td><b>${x.n}</b></td></tr>`).join("")||`<tr><td colspan="5" class="muted">まだ得点記録がありません</td></tr>`;
 const lossComboHtml=lossCombos.map((x,i)=>`<tr><td>${i+1}</td><td>${x.scene}</td><td>${x.ball}</td><td>${escapeHtml(x.cause)}</td><td><b>${x.n}</b></td></tr>`).join("")||`<tr><td colspan="5" class="muted">まだ失点記録がありません</td></tr>`;
 const page2=`<div class="dash-page" id="dashPage2">
   <div class="dash-section-title">③ 原因分析</div>
   <div class="cause-tabs"><button id="causeTabScore" class="active">得点原因</button><button id="causeTabLoss">失点原因</button></div>
   <div id="causeWindowScore" class="cause-window">
     <div class="dash-note">自分が得点したポイントだけを表示します。サーブ／レシーブと原因を分けて確認できます。</div>
     <table class="cross-table cause-matrix"><tr><th>得点原因</th><th>サーブ<br>得点</th><th>レシーブ<br>得点</th><th>合計</th></tr>${scoreHtml}</table>
     <div class="dash-section-title">得点：サーブ／レシーブ × 何球目 × 原因</div>
     <table class="combo-table"><tr><th>#</th><th>場面</th><th>球数</th><th>原因</th><th>回数</th></tr>${scoreComboHtml}</table>
   </div>
   <div id="causeWindowLoss" class="cause-window hidden">
     <div class="dash-note">自分が失点したポイントだけを表示します。サーブ／レシーブと原因を分けて確認できます。</div>
     <table class="cross-table cause-matrix"><tr><th>失点原因</th><th>サーブ<br>失点</th><th>レシーブ<br>失点</th><th>合計</th></tr>${lossHtml}</table>
     <div class="dash-section-title">失点：サーブ／レシーブ × 何球目 × 原因</div>
     <table class="combo-table"><tr><th>#</th><th>場面</th><th>球数</th><th>原因</th><th>回数</th></tr>${lossComboHtml}</table>
   </div>
   <div class="dash-card" style="margin-top:8px"><h3>ゲーム別 サーブ／レシーブ得失点</h3><table class="dash-table"><tr><th>G</th><th>自分サーブ<br>得-失</th><th>自分レシーブ<br>得-失</th></tr>${state.games.map((g,i)=>{const x=pointStatsForGame(g);return `<tr><td>G${i+1}</td><td>${x.msw}-${x.msl}</td><td>${x.mrw}-${x.mrl}</td></tr>`}).join("")}</table></div>
   <div class="dash-footer">スクリーンショット用：このページを2枚目として保存してください。上の「得点原因／失点原因」で切り替えて確認できます。</div>
 </div>`;
 $("dashboardContent").innerHTML=`<div class="dash-nav"><button id="dashTab1" class="active">1枚目：球数分析</button><button id="dashTab2">2枚目：原因分析</button></div>${page1}${page2}`;
 $("dashTab1").onclick=()=>switchDashPage(1);$("dashTab2").onclick=()=>switchDashPage(2);
 $("causeTabScore").onclick=()=>switchCauseWindow("score");$("causeTabLoss").onclick=()=>switchCauseWindow("loss");
 $("dashboardModal").classList.remove("hidden");
}
function switchDashPage(n){
 document.querySelectorAll(".dash-page").forEach((el,i)=>el.classList.toggle("active",i===n-1));
 [$("dashTab1"),$("dashTab2")].forEach((b,i)=>b.classList.toggle("active",i===n-1));
}
function switchCauseWindow(which){
 const score=which==="score";
 $("causeWindowScore").classList.toggle("hidden",!score);$("causeWindowLoss").classList.toggle("hidden",score);
 $("causeTabScore").classList.toggle("active",score);$("causeTabLoss").classList.toggle("active",!score);
}
function renderMatchList(){
 const list=getLibrary();
 if(!list.length){$("matchList").innerHTML='<div class="muted">まだ保存された試合はありません。</div>';return}
 $("matchList").innerHTML=list.map(m=>`<div class="match-row">
   <div class="info"><div class="title">${escapeHtml(m.date||"日付未設定")}　${escapeHtml(m.me||"自分")} vs ${escapeHtml(m.opp||"相手")}</div>
   <div class="sub">${m.gameWinsMe||0}-${m.gameWinsOpp||0}ゲーム　${escapeHtml(m.matchMemo||"")}</div></div>
   <div class="actions"><button data-load="${m.id}">開く</button><button class="danger" data-del="${m.id}">削除</button></div>
 </div>`).join("");
 document.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>loadMatch(b.dataset.load));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteMatch(b.dataset.del));
}
function loadMatch(id){
 const m=getLibrary().find(x=>x.id===id);if(!m)return;
 Object.assign(state,JSON.parse(JSON.stringify(m)));clearSelection();updateGameWins();saveCurrent();render();
 alert("保存した試合を読み込みました。");
}
function deleteMatch(id){
 if(!confirm("この保存データを削除しますか？"))return;
 saveLibrary(getLibrary().filter(x=>x.id!==id));
 if(state.id===id)localStorage.removeItem("tt_state");
 renderMatchList();
}
function newMatch(){
 if(state.games.some(g=>g.points.length)&&!confirm("現在の試合を保存したまま、新しい試合を始めますか？"))return;
 state.id=uid();state.date=new Date().toISOString().slice(0,10);state.opp="相手";state.matchMemo="";
 state.firstServer=null;state.currentGame=1;state.gameWinsMe=0;state.gameWinsOpp=0;
 state.games=[{me:0,opp:0,points:[]}];clearSelection();saveCurrent();render();
}
function recordPoint(){
 if(!state.selectedWinner||!state.selectedCause||!state.selectedBall){alert("得点者・何球目・原因をすべて選択してください。");return}
 const g=current(),winner=state.selectedWinner;
 const server=serverForPoint(g); // 記録前のサーバーを保存
 if(winner==="me")g.me++;else g.opp++;
 g.points.push({winner,ball:state.selectedBall,cause:state.selectedCause,note:$("note").value,time:video.currentTime||0,server});
 clearSelection();$("note").value="";
 updateGameWins();saveCurrent();render();
 const won=gameWinner(g);
 if(won && state.gameWinsMe<3 && state.gameWinsOpp<3){
   setTimeout(()=>{if(confirm(`G${state.currentGame}は${won==="me"?state.me:state.opp}が取得しました。次のゲームへ進みますか？`)){
     if(state.currentGame<5){state.currentGame++;if(!state.games[state.currentGame-1])state.games.push({me:0,opp:0,points:[]});clearSelection();saveCurrent();render()}
   }},80);
 }else if(won){alert("試合終了です。ダッシュボードで結果を確認できます。")}
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

$("videoFile").onchange=e=>{const f=e.target.files[0];if(f){video.src=URL.createObjectURL(f);video.load();$("status").textContent="動画読込済（端末内）"}};
$("playBtn").onclick=()=>video.paused?video.play():video.pause();
video.onplay=()=>{$("playBtn").textContent="⏸ 一時停止"};video.onpause=()=>{$("playBtn").textContent="▶ 再生"};
video.ontimeupdate=()=>{$("time").textContent=fmt(video.currentTime)};
$("backBtn").onclick=()=>video.currentTime=Math.max(0,video.currentTime-5);
$("fwdBtn").onclick=()=>video.currentTime=Math.min(video.duration||1,video.currentTime+5);

$("winMe").onclick=()=>{state.selectedWinner="me";state.selectedCause=null;state.selectedBall=null;render()};
$("winOpp").onclick=()=>{state.selectedWinner="opp";state.selectedCause=null;state.selectedBall=null;render()};
$("savePoint").onclick=recordPoint;

$("serveMe").onclick=()=>{if(state.games.some(g=>g.points.length)){alert("ゲーム開始後は変更できません。");return}state.firstServer="me";saveCurrent();render()};
$("serveOpp").onclick=()=>{if(state.games.some(g=>g.points.length)){alert("ゲーム開始後は変更できません。");return}state.firstServer="opp";saveCurrent();render()};

$("newGame").onclick=()=>{
 const g=current();updateGameWins();
 if(state.gameWinsMe>=3||state.gameWinsOpp>=3){alert("試合は終了しています。");return}
 if(!gameWinner(g)){alert("まだゲーム終了条件を満たしていません。");return}
 if(state.currentGame<5){state.currentGame++;if(!state.games[state.currentGame-1])state.games.push({me:0,opp:0,points:[]});clearSelection();saveCurrent();render()}
};
$("undo").onclick=()=>{
 const g=current();if(!g.points.length){alert("取り消す記録がありません。");return}
 const p=g.points.pop();if(p.winner==="me")g.me--;else g.opp--;clearSelection();updateGameWins();saveCurrent();render();
};

$("applyConfig").onclick=()=>{
 const me=$("causeConfigMe").value.split("\n").map(x=>x.trim()).filter(Boolean);
 const opp=$("causeConfigOpp").value.split("\n").map(x=>x.trim()).filter(Boolean);
 if(!me.length||!opp.length){alert("得点・失点の原因をそれぞれ1つ以上入力してください。");return}
 state.causes={me,opp};localStorage.setItem("tt_causes",JSON.stringify(state.causes));saveCurrent();render()
};
$("resetConfig").onclick=()=>{state.causes=JSON.parse(JSON.stringify(DEFAULT_CAUSES));localStorage.setItem("tt_causes",JSON.stringify(state.causes));saveCurrent();render()};
$("applyNames").onclick=()=>{state.me=$("meInput").value.trim()||"自分";state.opp=$("oppInput").value.trim()||"相手";$("matchOpponent").value=state.opp;saveCurrent();render()};

$("saveMatch").onclick=()=>{
 state.date=$("matchDate").value;
 state.opp=$("matchOpponent").value.trim()||"相手";
 state.matchMemo=$("matchMemo").value.trim();
 saveCurrent();render();alert("この試合を保存しました。");
};
$("newMatch").onclick=newMatch;
$("clearAllMatches").onclick=()=>{if(confirm("保存した試合データをすべて削除しますか？この操作は元に戻せません。")){localStorage.removeItem("tt_match_library");localStorage.removeItem("tt_state");newMatch()}};

$("exportJson").onclick=()=>download("tabletennis-analysis.json",JSON.stringify(snapshot(),null,2),"application/json");
$("exportCsv").onclick=()=>{
 let rows=[["試合日","対戦相手","ゲーム","点","動画時刻","勝者","サーバー","何球目","原因","メモ"]];
 state.games.forEach((g,gi)=>g.points.forEach((p,pi)=>rows.push([state.date,state.opp,gi+1,pi+1,fmt(p.time),p.winner==="me"?state.me:state.opp,p.server==="me"?state.me:state.opp,BALL_LABELS[p.ball]||"",p.cause||"",p.note||""])));
 const csv="\ufeff"+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
 download("tabletennis-analysis.csv",csv,"text/csv;charset=utf-8");
};

$("importBtn").onclick=()=>$("importJson").click();
$("importJson").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{try{
   const s=JSON.parse(r.result);Object.assign(state,s);
   if(Array.isArray(state.causes)){ state.causes={me:[...state.causes],opp:[...DEFAULT_CAUSES.opp]}; }
   state.causes=state.causes?.me?.length?state.causes:{me:[...DEFAULT_CAUSES.me],opp:[...DEFAULT_CAUSES.opp]};
   state.games=state.games?.length?state.games:[{me:0,opp:0,points:[]}];
   state.games.forEach(g=>g.points.forEach(p=>{if(!p.ball)p.ball=5}));
   clearSelection();updateGameWins();saveCurrent();render();alert("読み込みました。");
 }catch(err){alert("JSONを読み込めませんでした。")}};r.readAsText(f)
};

const modal=document.createElement("div");
modal.id="dashboardModal";modal.className="modal hidden";
modal.innerHTML=`<div class="dashboard"><div class="dashboard-head"><div><div class="dash-title">🏓 試合分析ダッシュボード</div><div id="dashSub" class="dash-sub"></div></div><button id="closeDashboard">閉じる</button></div><div id="dashboardContent"></div></div>`;
document.body.appendChild(modal);
$("dashboardBtn").onclick=renderDashboard;
$("closeDashboard").onclick=()=>$("dashboardModal").classList.add("hidden");

loadCurrent();
if(!state.id){state.id=uid();state.date=new Date().toISOString().slice(0,10);saveCurrent()}
render();

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
